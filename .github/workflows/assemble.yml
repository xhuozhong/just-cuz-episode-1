name: Restore verified episode runtime
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download and verify reviewed asset bundles
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,os,pathlib,subprocess,hashlib,re
          p=json.loads(pathlib.Path('runtime-import.json').read_text())
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'episode-bundles'
          root.mkdir()
          def run(*args): return subprocess.run(args,check=True,capture_output=True,text=True).stdout.strip()
          run('git','fetch','--no-tags','origin',*p['alreadyRemoteCommits'])
          for bundle in sorted(p['bundles'],key=lambda b:b['name']=='reviewed-final.bundle'):
              assert re.fullmatch(r'[A-Za-z0-9._-]+',bundle['name'])
              file=root/bundle['name']
              with file.open('wb') as output:
                  for chunk in bundle['chunks']:
                      part=root/chunk['name']
                      with part.open('wb') as sink:
                          subprocess.run(['gh','api','-H','Accept: application/octet-stream',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{chunk['id']}"],stdout=sink,check=True)
                      data=part.read_bytes()
                      assert len(data)==chunk['bytes'] and hashlib.sha256(data).hexdigest()==chunk['sha256']
                      output.write(data)
                      part.unlink()
              assert file.stat().st_size==bundle['bytes'] and hashlib.sha256(file.read_bytes()).hexdigest()==bundle['sha256']
              run('git','bundle','verify',str(file))
              run('git','fetch',str(file),bundle['commit'])
              run('git','update-ref','refs/remotes/runtime-import/'+bundle['name'].replace('.','-'),bundle['commit'])
          assert run('git','rev-parse',p['reviewedFinalCommit']+':dist')==p['reviewedDistTree']
          run('git','checkout',p['reviewedFinalCommit'],'--','dist')
          tree=run('git','write-tree')
          assert run('git','rev-parse',tree+':dist')==p['reviewedDistTree']
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              run('git','commit','-m','Import verified first episode runtime')
              run('git','push','origin','HEAD:main')
          print('Verified complete episode runtime imported.')
